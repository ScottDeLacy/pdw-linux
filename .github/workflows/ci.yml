name: CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-multimedia-dev libssl-dev python3 xvfb
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja qt openssl python3
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{ runner.os == 'macOS' && '-DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix openssl)"' || '' }}
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
